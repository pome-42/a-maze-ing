[project]
name = "mazegen"
version = "0.1.0"
requires-python = ">=3.12"
readme = "README.md"

[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["mazegen"]
py-modules = [
    "config",
    "maze",
    "maze_generator",
    "maze_output",
    "maze_solver",
    "maze_types",
    "maze_validator",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.0",
]
