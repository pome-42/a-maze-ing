name: Python checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type-check:
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install check tools
        run: python -m pip install --group checks

      - name: Run flake8
        run: python -m flake8 .

      - name: Run mypy in strict mode
        run: |
          if find . -type f \( -name '*.py' -o -name '*.pyi' \) \
            -not -path './.git/*' -print -quit | grep -q .; then
            python -m mypy .
          else
            echo "No Python files found; skipping mypy."
          fi
