name: Python checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: python-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-type-check:
    runs-on: ubuntu-slim
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run flake8
        run: uv run flake8 .

      - name: Run mypy in strict mode
        run: |
          if find . -type f \( -name '*.py' -o -name '*.pyi' \) \
            -not -path './.git/*' -print -quit | grep -q .; then
            uv run mypy .
          else
            echo "No Python files found; skipping mypy."
          fi
